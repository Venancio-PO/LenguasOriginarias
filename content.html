<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/estilosContent.css">
    <script src="scripts/scriptContent.js" defer></script>
    <title>contenido</title>
</head>
<body>
    <h1>
        <span class="titulo-chatino">Tsa'jnyä jï'ï kitsë kia'a kyéku</span>
        <span class="titulo-espanol">Chatino de Zenzontepec</span>
    </h1>
    <div id="contenedor1">
        <div>
            <button id="btnhistoria">
                <span class="nombre-chatino">Chu'u ndoo tsashi itsa' jï'ï</span>
                <span class="nombre-espanol">Conoce su historia</span>
            </button>
        </div>
        <div>
            <button id="btnaprende">
                <span class="nombre-chatino">Katsä'ä tsashi</span>
                <span class="nombre-espanol">Aprende un poco</span>
            </button>
        </div>
        <div>
            <button id="btnjuegos">
                <span class="nombre-chatino">Nyä'ä kuea tukui ngatsä'ä</span>
                <span class="nombre-espanol">Pon a prueba lo aprendido</span>
            </button>
        </div>
    </div>
    <button id="btnAtras">
        <span class="nombre-chatino-regresar">Tya tsutsö'</span>
        <span class="nombre-espanol-regresar">Atrás</span>
    </button>
</body>
</html>
