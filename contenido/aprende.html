<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/estilosAprende.css">
    <script src="../scripts/scriptAprende.js" defer></script>
    <title>Aprende</title>
</head>
<body>
    <h1>
        <span class="titulo-chatino">Katsä'ä tsashi</span>
        <span class="titulo-espanol">Aprende un poco</span>
    </h1>

    <div id="temas-grid">
        <button class="tema-btn" data-tema="frutas">
            <span class="tema-chatino">Nchi'yú</span>
            <span class="tema-espanol">Frutas</span>
        </button>
        <button class="tema-btn" data-tema="familia">
            <span class="tema-chatino">Letaa</span>
            <span class="tema-espanol">Familia</span>
        </button>
        <button class="tema-btn" data-tema="numeros">
            <span class="tema-chatino">Numero</span>
            <span class="tema-espanol">Números</span>
        </button>
        <button class="tema-btn" data-tema="colores">
            <span class="tema-chatino">Kulor</span>
            <span class="tema-espanol">Colores</span>
        </button>
        <button class="tema-btn" data-tema="tiempo">
            <span class="tema-chatino">Kuea'</span>
            <span class="tema-espanol">Tiempo</span>
        </button>
        <button class="tema-btn" data-tema="animales">
            <span class="tema-chatino">Nya'ne</span>
            <span class="tema-espanol">Animales</span>
        </button>
        <button class="tema-btn" data-tema="plantas">
            <span class="tema-chatino">Kishë'</span>
            <span class="tema-espanol">Plantas</span>
        </button>
    </div>

    <div id="contenido-tema" class="oculto">
        <h2 id="tema-titulo"></h2>
        <ul id="tema-lista"></ul>
        <button id="btnCerrarTema">
            <span class="nombre-chatino-regresar">Kisetë'ë</span>
            <span class="nombre-espanol-regresar">Volver a los temas</span>
        </button>
    </div>

    <button id="btnAtrasAprende">
        <span class="nombre-chatino-regresar">Tya tsutsö'</span>
        <span class="nombre-espanol-regresar">Atrás</span>
    </button>
</body>
</html>
